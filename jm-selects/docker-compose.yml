# JM Selects – deploy with the UGOS Pro Docker app (Project page) or `docker compose up -d`.
# All settings live in the .env file next to this one.
services:
  jm-selects:
    build: .
    image: jm-selects:latest
    container_name: jm-selects
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      STAFF_PIN: ${STAFF_PIN:?Set STAFF_PIN in .env}
      PACKAGE_SIZES: ${PACKAGE_SIZES:-10,20,30,50}
      EXTRA_IMAGE_PRICE: ${EXTRA_IMAGE_PRICE:-250}
      BACKUP_SUFFIX: ${BACKUP_SUFFIX:-backup}
      PROJECTS_LABEL: ${PROJECTS_PATH:?Set PROJECTS_PATH in .env}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      # Photos: READ-ONLY. The app can never change, move or delete anything here.
      - "${PHOTOS_PATH:?Set PHOTOS_PATH in .env}:/photos:ro"
      # RAW project folders: the ONLY place the app may write photo files (copies).
      - "${PROJECTS_PATH:?Set PROJECTS_PATH in .env}:/projects"
      # App data: ratings, selections and the thumbnail cache.
      - "${DATA_PATH:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only used by the start-up script to fix the data folder's owner and switch to a
      # normal user; the app itself runs without them.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
