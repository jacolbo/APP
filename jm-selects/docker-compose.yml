# JM Selects - deploy with the UGOS Pro Docker app (Project > Create > Import).
# All settings live in the .env file next to this one.
services:
  jm-selects:
    build: .
    image: jm-selects:latest
    container_name: jm-selects
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      STAFF_PIN: ${STAFF_PIN}
      PACKAGE_SIZES: ${PACKAGE_SIZES:-10,20,30,50}
      EXTRA_IMAGE_PRICE: ${EXTRA_IMAGE_PRICE:-250}
      BACKUP_SUFFIX: ${BACKUP_SUFFIX:-backup}
      PROJECTS_LABEL: ${PROJECTS_PATH}
      WIFI_SSID: ${WIFI_SSID}
      WIFI_PASSWORD: ${WIFI_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      # Photos: READ-ONLY. The app can never change, move or delete anything here.
      - "${PHOTOS_PATH}:/photos:ro"
      # RAW project folders: the only place the app writes photo files (copies).
      - "${PROJECTS_PATH}:/projects"
      # App data: ratings, selections and the thumbnail cache.
      - "${DATA_PATH:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
