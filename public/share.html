<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Pose gallery</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23101013'/><circle cx='16' cy='16' r='6' fill='%23e5b487'/></svg>">
</head>
<body>

  <!-- PIN gate -->
  <div class="centered" id="pin-view" hidden>
    <form class="login-card" id="pin-form">
      <h1>Private gallery</h1>
      <p class="hint" style="margin-bottom:20px">Enter the PIN your photographer gave you.</p>
      <label class="field">
        <span>PIN</span>
        <input type="text" id="pin-input" inputmode="numeric" autocomplete="off" required autofocus>
      </label>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">View gallery</button>
      <p class="hint" id="pin-error" style="color:var(--danger)" hidden></p>
    </form>
  </div>

  <!-- Missing / unpublished -->
  <div class="centered" id="gone-view" hidden>
    <div class="login-card" style="text-align:center">
      <h1>Gallery unavailable</h1>
      <p class="hint" id="gone-message">This link is no longer active. Ask your photographer for a new one.</p>
    </div>
  </div>

  <!-- Gallery -->
  <div id="gallery-view" hidden>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <span class="brand"><span class="dot"></span> <span id="brand-title">Pose gallery</span></span>
        <span class="spacer"></span>
        <span class="badge" id="pick-count">♥ 0 picked</span>
        <label class="switch small"><input type="checkbox" id="only-mine"><span>Only my picks</span></label>
        <button class="btn btn-sm btn-ghost" id="change-name" hidden></button>
      </div>
    </header>

    <main class="wrap" style="padding-bottom:70px">
      <div class="gallery-head">
        <h1 id="gallery-title"></h1>
        <p class="muted" id="gallery-subtitle" style="margin:0"></p>
        <p class="hint" style="margin-top:14px">Tap the heart on any pose you love — your photographer sees your picks.</p>
      </div>

      <div class="photo-grid" id="photo-grid"></div>
      <div class="empty" id="gallery-empty" hidden>No poses have been added to this gallery yet.</div>
    </main>
  </div>

  <div id="modal-root"></div>
  <script src="/share.js" type="module"></script>
</body>
</html>
