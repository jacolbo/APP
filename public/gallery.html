<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Your gallery</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23101013'/><circle cx='16' cy='16' r='6' fill='%23e5b487'/></svg>">
</head>
<body>

  <!-- Missing, unpublished, or link reset -->
  <div class="centered" id="gone-view" hidden>
    <div class="login-card" style="text-align:center">
      <h1>Gallery unavailable</h1>
      <p class="hint" id="gone-message">This link is no longer active. Ask your photographer for a new one.</p>
    </div>
  </div>

  <div id="gallery-view" hidden>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <span class="brand"><img id="brand-logo" alt="" hidden><span class="dot" id="brand-dot"></span> <span id="brand-title">Gallery</span></span>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-ghost" id="jump-favorites">♥ <span id="top-count">0</span></button>
        <button class="btn btn-sm btn-ghost" id="lock-button" hidden title="Lock the protected tabs again">Lock</button>
      </div>
    </header>

    <!-- 1. Cover -->
    <section class="cover" id="cover">
      <div class="cover-media"><img id="cover-image" alt="" hidden></div>
      <div class="cover-copy">
        <img class="cover-logo" id="cover-logo" alt="" hidden>
        <p class="cover-eyebrow" id="cover-client" hidden></p>
        <h1 id="cover-title"></h1>
        <p class="cover-note" id="cover-description" hidden></p>
        <button class="btn btn-primary" id="cover-scroll">Start browsing</button>
      </div>
    </section>

    <main class="wrap" style="padding-bottom:80px">

      <!-- 2. Favourites -->
      <section class="panel favorites" id="favorites-section">
        <div class="row">
          <h2 style="margin:0">Your favourites <span class="muted" id="favorites-count"></span></h2>
          <span class="spacer"></span>
          <button class="btn btn-sm" id="download-picks" hidden>Download my picks</button>
          <button class="btn btn-sm btn-primary" id="send-button" hidden>Send to photographer</button>
        </div>
        <p class="hint" id="expiry-note" hidden></p>
        <p class="hint" id="favorites-empty">Nothing picked yet — tap any photo below and it lands here.</p>
        <button class="btn btn-sm btn-ghost" id="restore-button" hidden style="margin-top:8px">Picked on another device?</button>
        <div class="fav-strip" id="favorites-strip"></div>
        <p class="hint" id="send-status" hidden></p>
      </section>

      <!-- 3. Gallery -->
      <nav class="crumbs" id="crumbs" aria-label="Folders"></nav>
      <h2 class="section-head" id="folders-head" hidden>Folders</h2>
      <div class="cards folder-cards" id="folder-cards"></div>
      <div class="tabbar" id="tabbar" role="tablist"></div>
      <div class="photo-grid" id="image-grid"></div>
      <div class="empty" id="grid-empty" hidden></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <script src="/gallery.js" type="module"></script>
</body>
</html>
